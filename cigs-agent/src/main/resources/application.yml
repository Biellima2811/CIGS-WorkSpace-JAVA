server:
  port: 5580 # Mantendo a porta original do Flask para manter compatibilidade com o legado

spring:
  application:
    name: cigs-agent
  autoconfigure:
    # Desativa a exigência de um banco de dados fixo ao iniciar o Agente
    exclude: 
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration